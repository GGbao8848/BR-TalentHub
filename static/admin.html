<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR TalentHub · 招聘会管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #e8f1f5;
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .logo span { color: #4fc3f7; }
  .event-name { font-size: 20px; font-weight: 600; color: #ffe082; }

  /* 页签 */
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    background: rgba(255,255,255,0.08); color: #b3cde0; border: 1px solid rgba(255,255,255,0.12);
    transition: all .15s; user-select: none;
  }
  .tab:hover { background: rgba(255,255,255,0.14); }
  .tab.active { background: #4fc3f7; color: #08303f; border-color: #4fc3f7; }
  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 20px;
    backdrop-filter: blur(6px);
    margin-bottom: 24px;
  }
  .card h2 { font-size: 15px; color: #b3cde0; margin-bottom: 16px; font-weight: 600; }
  .card h2 .hint { font-size: 12px; color: #7a93a8; font-weight: 400; margin-left: 8px; }
  label { display: block; font-size: 13px; color: #9fb8cc; margin: 12px 0 6px; }
  input[type=text], input[type=search], select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 14px; outline: none;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { border-color: #4fc3f7; }
  select option { background: #1c2f3a; color: #fff; }
  .btn {
    display: inline-block; padding: 10px 18px; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-weight: 600; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #4fc3f7; color: #08303f; }
  .btn-ghost { background: rgba(255,255,255,0.1); color: #e8f1f5; }
  .btn-danger { background: #ef5350; color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-green { background: #66bb6a; color: #08303f; }

  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 200px; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { color: #9fb8cc; font-weight: 600; font-size: 13px; }
  tr:hover td { background: rgba(255,255,255,0.04); }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px;
    background: rgba(79,195,247,0.15); color: #81d4fa; border: 1px solid rgba(79,195,247,0.4); margin: 2px;
  }
  .empty { color: #7a93a8; text-align: center; padding: 24px 0; font-size: 14px; }
  .muted { color: #7a93a8; font-size: 12px; }

  /* 看板 */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; text-align: center; }
  .stat .num { font-size: 34px; font-weight: 700; color: #4fc3f7; }
  .stat .lbl { font-size: 13px; color: #9fb8cc; margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .bar-label { width: 140px; font-size: 13px; color: #b3cde0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .bar-track { flex: 1; height: 22px; background: rgba(255,255,255,0.07); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #26a69a); border-radius: 6px; min-width: 2px; transition: width .4s; }
  .bar-val { width: 44px; text-align: right; font-size: 13px; color: #81d4fa; flex-shrink: 0; }

  /* 学校二维码列表 */
  .school-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .school-card {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .school-card img { width: 150px; height: 150px; background: #fff; padding: 8px; border-radius: 8px; }
  .school-card .sname { font-size: 14px; font-weight: 600; margin: 8px 0 4px; color: #ffe082; }
  .school-card .spos { font-size: 12px; color: #9fb8cc; }
  .school-card .surl { font-size: 11px; color: #7a93a8; word-break: break-all; margin-top: 4px; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #32373e; color: #fff; padding: 12px 22px; border-radius: 8px;
    font-size: 14px; z-index: 99; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: #c62828; }
  .recent { list-style: none; }
  .recent li {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px;
  }
  .recent li:last-child { border-bottom: none; }
  .recent .badge { width: 8px; height: 8px; border-radius: 50%; background: #66bb6a; flex-shrink: 0; }
  .recent .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .meta { color: #9fb8cc; font-size: 12px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">BR <span>TalentHub</span> · 招聘会管理</div>
    <div class="event-name" id="headerEvent">—</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-page="screen" onclick="switchPage('screen')">📺 现场大屏</div>
    <div class="tab" data-page="positions" onclick="switchPage('positions')">💼 岗位管理</div>
    <div class="tab" data-page="schools" onclick="switchPage('schools')">🏫 学校管理</div>
    <div class="tab" data-page="dashboard" onclick="switchPage('dashboard')">📊 数据看板</div>
  </div>

  <!-- ============ 现场大屏 ============ -->
  <div class="page active" id="page-screen">
    <div class="card">
      <h2>招聘会设置</h2>
      <div class="row">
        <div class="grow">
          <label>招聘会名称</label>
          <input type="text" id="eventName" placeholder="如：2026 北人招聘会">
        </div>
        <div class="grow">
          <label>简历保存目录</label>
          <input type="text" id="saveDir" placeholder="如：D:\招聘会\2026">
        </div>
        <button class="btn btn-primary" onclick="saveConfig()">保存</button>
        <button class="btn btn-danger btn-sm" onclick="resetEvent()">开始新一场</button>
      </div>
      <div class="muted" id="saveDirHint" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>现场扫码上传</h2>
      <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start">
        <div style="text-align:center">
          <img id="qrImg" src="/api/qrcode?t=1" alt="二维码" style="width:220px;height:220px;background:#fff;padding:10px;border-radius:10px">
          <div class="muted" id="qrUrl" style="margin-top:8px;max-width:280px;word-break:break-all"></div>
        </div>
        <div style="flex:1;min-width:260px">
          <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:0">
            <div class="stat"><div class="num" id="statCount">0</div><div class="lbl">已收简历</div></div>
            <div class="stat"><div class="num" id="statToday">0</div><div class="lbl">本场新增</div></div>
          </div>
          <h2 style="margin-top:16px">最近上传</h2>
          <ul class="recent" id="recentList"><li class="empty">暂无上传记录</li></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 岗位管理 ============ -->
  <div class="page" id="page-positions">
    <div class="card">
      <h2>新增岗位</h2>
      <div class="row">
        <div class="grow"><label>岗位名称</label><input type="text" id="posName" placeholder="如：研发工程师"></div>
        <div class="grow"><label>岗位要求</label><input type="text" id="posReq" placeholder="选填，岗位职责/要求"></div>
        <button class="btn btn-primary" onclick="addPosition()">添加岗位</button>
      </div>
    </div>

    <div class="card">
      <h2>Excel 导入岗位
        <span class="hint">识别表头「岗位名称 / 岗位要求」（支持 岗位/职位 等别名），上传 .xlsx</span>
      </h2>
      <div class="row">
        <input type="file" id="importFile" accept=".xlsx,.xlsm" style="display:none">
        <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">选择 Excel 文件</button>
        <button class="btn btn-green" onclick="importPositions()">导入</button>
        <span class="muted" id="importStatus"></span>
      </div>
    </div>

    <div class="card">
      <h2>岗位列表（<span id="posCount">0</span>）</h2>
      <table>
        <thead><tr><th style="width:60px">ID</th><th style="width:200px">岗位名称</th><th>岗位要求</th><th style="width:80px">操作</th></tr></thead>
        <tbody id="posTbody"></tbody>
      </table>
      <div class="empty" id="posEmpty">暂无岗位，请先添加或导入</div>
    </div>
  </div>

  <!-- ============ 学校管理 ============ -->
  <div class="page" id="page-schools">
    <div class="card">
      <h2>新增学校</h2>
      <div class="row">
        <div class="grow"><label>学校名称</label><input type="text" id="schoolName" placeholder="如：北京大学"></div>
        <button class="btn btn-primary" onclick="addSchool()">添加学校</button>
      </div>
      <label style="margin-top:14px">绑定岗位（该校开放招聘的岗位，可多选）</label>
      <div id="schoolPosCheckbox" class="muted" style="margin-top:6px">请先添加岗位</div>
    </div>

    <div class="card">
      <h2>学校列表（<span id="schoolCount">0</span>）· 每校独立二维码</h2>
      <div class="school-grid" id="schoolGrid"></div>
      <div class="empty" id="schoolEmpty">暂无学校</div>
    </div>
  </div>

  <!-- ============ 数据看板 ============ -->
  <div class="page" id="page-dashboard">
    <div class="stat-grid">
      <div class="stat"><div class="num" id="dashTotal">0</div><div class="lbl">简历总数</div></div>
      <div class="stat"><div class="num" id="dashSchool">0</div><div class="lbl">学校数</div></div>
      <div class="stat"><div class="num" id="dashPos">0</div><div class="lbl">岗位数</div></div>
    </div>

    <div class="card">
      <h2>按学校统计</h2>
      <div id="dashSchoolBar"></div>
    </div>
    <div class="card">
      <h2>按岗位统计</h2>
      <div id="dashPosBar"></div>
    </div>
    <div class="card">
      <h2>近 7 日收集趋势</h2>
      <div id="dashDayBar"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let config = null;
let positions = [];
let schools = [];

function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function switchPage(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  if (name === 'positions') loadPositions();
  if (name === 'schools') loadSchools();
  if (name === 'dashboard') loadDashboard();
}

// ============ 通用加载 ============
async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    config = await r.json();
    document.getElementById('eventName').value = config.event_name;
    document.getElementById('saveDir').value = config.save_dir;
    document.getElementById('saveDirHint').textContent = '当前保存目录：' + config.save_dir;
    document.getElementById('headerEvent').textContent = config.event_name;
    document.getElementById('qrUrl').textContent = getAccessUrl(config);
    document.getElementById('statCount').textContent = config.count;
  } catch (e) { toast('无法连接后端服务', true); }
}

function getAccessUrl(cfg) {
  return `手机访问：http://${cfg.host_ip}:${cfg.port}/upload?event=${cfg.event_id}`;
}

async function saveConfig() {
  const payload = {
    event_name: document.getElementById('eventName').value,
    save_dir: document.getElementById('saveDir').value,
  };
  const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!r.ok) { const err = await r.json().catch(() => ({})); toast(err.detail || '保存失败', true); return; }
  config = await r.json();
  document.getElementById('qrImg').src = '/api/qrcode?t=' + Date.now();
  loadConfig();
  toast('已保存 ✅');
}

async function resetEvent() {
  if (!confirm('确定开始新一场招聘会？将生成新二维码，已收简历不删除。')) return;
  const r = await fetch('/api/event/reset', { method: 'POST' });
  config = await r.json();
  document.getElementById('qrImg').src = '/api/qrcode?t=' + Date.now();
  loadConfig();
  toast('已开始新一场');
}

// ============ 现场大屏统计 ============
async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    document.getElementById('statCount').textContent = d.count;
    document.getElementById('statToday').textContent = d.count;
    const ul = document.getElementById('recentList');
    if (!d.recent || d.recent.length === 0) {
      ul.innerHTML = '<li class="empty">暂无上传记录</li>';
    } else {
      ul.innerHTML = d.recent.map(item => {
        const school = item.school_name ? ' · ' + item.school_name : '';
        const meta = `${item.upload_time.slice(11,16)} · ${item.name || '未留名'}${school}`;
        return `<li><span class="badge"></span><span class="fname">📄 ${escapeHtml(item.original)}</span><span class="meta">${escapeHtml(meta)}</span></li>`;
      }).join('');
    }
  } catch (e) {}
}

// ============ 岗位管理 ============
async function loadPositions() {
  try {
    const r = await fetch('/api/positions');
    positions = await r.json();
    document.getElementById('posCount').textContent = positions.length;
    const tb = document.getElementById('posTbody');
    document.getElementById('posEmpty').style.display = positions.length ? 'none' : 'block';
    tb.innerHTML = positions.map(p => `<tr>
      <td>${p.id}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.requirement || '—')}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deletePosition(${p.id})">删除</button></td>
    </tr>`).join('');
  } catch (e) { toast('加载岗位失败', true); }
}

async function addPosition() {
  const name = document.getElementById('posName').value.trim();
  const requirement = document.getElementById('posReq').value.trim();
  if (!name) { toast('请填写岗位名称', true); return; }
  const r = await fetch('/api/positions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, requirement }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.detail || '添加失败', true); return; }
  document.getElementById('posName').value = '';
  document.getElementById('posReq').value = '';
  loadPositions();
  toast('岗位已添加 ✅');
}

async function deletePosition(id) {
  const p = positions.find(x => x.id === id);
  if (!confirm(`确定删除岗位「${p ? p.name : ''}」？`)) return;
  const r = await fetch('/api/positions/' + id, { method: 'DELETE' });
  if (!r.ok) { toast('删除失败', true); return; }
  loadPositions(); loadSchools();
  toast('已删除');
}

function importPositions() {
  const f = document.getElementById('importFile').files[0];
  if (!f) { toast('请先选择 Excel 文件', true); return; }
  const fd = new FormData();
  fd.append('file', f);
  document.getElementById('importStatus').textContent = '导入中…';
  fetch('/api/positions/import', { method: 'POST', body: fd })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) { toast(d.detail || '导入失败', true); document.getElementById('importStatus').textContent = ''; return; }
      document.getElementById('importStatus').textContent = `新增 ${d.created} 条，跳过空行 ${d.skipped}，重复 ${d.duplicates.length} 条`;
      toast(`导入完成：新增 ${d.created} 个岗位 ✅`);
      document.getElementById('importFile').value = '';
      loadPositions();
    })
    .catch(() => { toast('导入失败', true); document.getElementById('importStatus').textContent = ''; });
}

// ============ 学校管理 ============
async function loadSchools() {
  try {
    const r = await fetch('/api/schools');
    schools = await r.json();
    document.getElementById('schoolCount').textContent = schools.length;
    document.getElementById('schoolEmpty').style.display = schools.length ? 'none' : 'block';
    renderSchoolGrid();
    renderSchoolCheckboxes();
  } catch (e) { toast('加载学校失败', true); }
}

function renderSchoolGrid() {
  const grid = document.getElementById('schoolGrid');
  if (!schools.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = schools.map(s => {
    const posTags = (s.positions || []).map(p => `<span class="tag">${escapeHtml(p.name)}</span>`).join('') || '<span class="muted">未绑定岗位</span>';
    const url = `/upload?event=${config ? config.event_id : ''}&school=${encodeURIComponent(s.name)}`;
    return `<div class="school-card">
      <img src="/api/schools/${s.id}/qrcode?t=${Date.now()}" alt="二维码">
      <div class="sname">${escapeHtml(s.name)}</div>
      <div class="spos">${posTags}</div>
      <div class="surl">${escapeHtml(url)}</div>
      <div style="margin-top:8px;display:flex;gap:6px;justify-content:center">
        <button class="btn btn-ghost btn-sm" onclick="editSchoolPos(${s.id})">改岗位</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSchool(${s.id})">删除</button>
      </div>
    </div>`;
  }).join('');
}

function renderSchoolCheckboxes() {
  const box = document.getElementById('schoolPosCheckbox');
  if (!positions.length) { box.innerHTML = '<span class="muted">请先在「岗位管理」添加岗位</span>'; return; }
  box.innerHTML = positions.map(p =>
    `<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:13px;color:#b3cde0;font-weight:400">
      <input type="checkbox" class="school-pos-cb" value="${p.id}" style="width:auto"> ${escapeHtml(p.name)}
    </label>`
  ).join('');
}

async function addSchool() {
  const name = document.getElementById('schoolName').value.trim();
  if (!name) { toast('请填写学校名称', true); return; }
  const ids = [...document.querySelectorAll('.school-pos-cb:checked')].map(cb => Number(cb.value));
  const r = await fetch('/api/schools', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, positions: ids }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.detail || '添加失败', true); return; }
  document.getElementById('schoolName').value = '';
  loadSchools();
  toast('学校已添加 ✅');
}

async function editSchoolPos(id) {
  const s = schools.find(x => x.id === id);
  if (!s) return;
  const posOptions = positions.map(p =>
    `<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:13px;color:#b3cde0;font-weight:400">
      <input type="checkbox" class="edit-pos-cb" value="${p.id}" ${(s.position_ids||[]).includes(p.id)?'checked':''} style="width:auto"> ${escapeHtml(p.name)}
    </label>`).join('') || '<span class="muted">暂无岗位</span>';
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `
    <div style="margin-bottom:14px">学校「${escapeHtml(s.name)}」绑定岗位：</div>
    <div style="margin-bottom:16px">${posOptions}</div>
    <div style="text-align:right"><button class="btn btn-primary" id="editSaveBtn">保存</button></div>`;
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100';
  const box = document.createElement('div');
  box.style.cssText = 'background:#1c2f3a;padding:24px;border-radius:12px;min-width:320px;max-width:480px';
  box.appendChild(wrapper);
  modal.appendChild(box);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
  document.getElementById('editSaveBtn').onclick = async () => {
    const ids = [...document.querySelectorAll('.edit-pos-cb:checked')].map(cb => Number(cb.value));
    const r = await fetch(`/api/schools/${id}/positions`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ positions: ids }) });
    if (!r.ok) { toast('保存失败', true); return; }
    modal.remove(); loadSchools(); toast('已更新岗位绑定 ✅');
  };
}

async function deleteSchool(id) {
  const s = schools.find(x => x.id === id);
  if (!confirm(`确定删除学校「${s ? s.name : ''}」？已收简历记录将保留，但学校信息移除。`)) return;
  const r = await fetch('/api/schools/' + id, { method: 'DELETE' });
  if (!r.ok) { toast('删除失败', true); return; }
  loadSchools();
  toast('已删除');
}

// ============ 数据看板 ============
async function loadDashboard() {
  try {
    const r = await fetch('/api/dashboard');
    const d = await r.json();
    document.getElementById('dashTotal').textContent = d.total;
    document.getElementById('dashSchool').textContent = schools.length || (await (await fetch('/api/schools')).json()).length;
    document.getElementById('dashPos').textContent = positions.length || (await (await fetch('/api/positions')).json()).length;

    renderBars('dashSchoolBar', d.by_school, d.total);
    renderBars('dashPosBar', d.by_position, d.total);
    renderBars('dashDayBar', d.by_day, d.total);
  } catch (e) { toast('加载看板失败', true); }
}

function renderBars(containerId, data, total) {
  const el = document.getElementById(containerId);
  if (!data || !data.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const max = Math.max(...data.map(x => x.count));
  el.innerHTML = data.map(x => {
    const pct = max ? Math.round(x.count / max * 100) : 0;
    return `<div class="bar-row">
      <div class="bar-label" title="${escapeHtml(x.name)}">${escapeHtml(x.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-val">${x.count}</div>
    </div>`;
  }).join('');
}

// ============ 初始化 ============
loadConfig();
loadStats();
setInterval(loadStats, 3000);
document.getElementById('importFile').addEventListener('change', () => {
  const f = document.getElementById('importFile').files[0];
  document.getElementById('importStatus').textContent = f ? '已选择：' + f.name : '';
});
</script>
