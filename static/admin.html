<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR TalentHub · 简历收集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #e8f1f5;
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .logo span { color: #4fc3f7; }
  .event-name { font-size: 20px; font-weight: 600; color: #ffe082; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .card h2 { font-size: 15px; color: #b3cde0; margin-bottom: 16px; font-weight: 600; }
  label { display: block; font-size: 13px; color: #9fb8cc; margin: 12px 0 6px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: #4fc3f7; }
  .btn {
    display: inline-block; padding: 10px 18px; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-weight: 600; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #4fc3f7; color: #08303f; width: 100%; margin-top: 18px; }
  .btn-ghost { background: rgba(255,255,255,0.1); color: #e8f1f5; }
  .btn-danger { background: #ef5350; color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  .qr-box { text-align: center; }
  .qr-box img { width: 220px; height: 220px; background: #fff; padding: 10px; border-radius: 10px; }
  .qr-url { font-size: 12px; color: #9fb8cc; margin-top: 10px; word-break: break-all; }
  .qr-hint { font-size: 13px; color: #ffe082; margin-top: 8px; }

  .stat-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 160px; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; text-align: center;
  }
  .stat .num { font-size: 34px; font-weight: 700; color: #4fc3f7; }
  .stat .lbl { font-size: 13px; color: #9fb8cc; margin-top: 4px; }

  .recent { list-style: none; }
  .recent li {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px;
  }
  .recent li:last-child { border-bottom: none; }
  .recent .badge { width: 8px; height: 8px; border-radius: 50%; background: #66bb6a; flex-shrink: 0; }
  .recent .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .meta { color: #9fb8cc; font-size: 12px; flex-shrink: 0; }
  .empty { color: #7a93a8; text-align: center; padding: 24px 0; font-size: 14px; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #32373e; color: #fff; padding: 12px 22px; border-radius: 8px;
    font-size: 14px; z-index: 99; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: #c62828; }
  .dir-line { display: flex; gap: 8px; }
  .dir-line input { flex: 1; }
  .savedir-hint { font-size: 12px; color: #7a93a8; margin-top: 8px; word-break: break-all; }
  .status-pill {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px;
    background: rgba(102,187,106,0.15); color: #a5d6a7; border: 1px solid rgba(102,187,106,0.4);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">BR <span>TalentHub</span></div>
    <div class="event-name" id="headerEvent">—</div>
  </header>

  <div class="grid">
    <!-- 左栏：设置 + 二维码 -->
    <div>
      <div class="card" style="margin-bottom:24px">
        <h2>招聘会设置</h2>
        <label>招聘会名称</label>
        <input type="text" id="eventName" placeholder="如：2026 北人招聘会">
        <label>简历保存目录</label>
        <div class="dir-line">
          <input type="text" id="saveDir" placeholder="如：D:\招聘会\2026-08">
          <button class="btn btn-ghost btn-sm" onclick="pickDir()">浏览</button>
        </div>
        <label>公网访问地址（可选，填了手机在任何网络都能扫码）</label>
        <input type="text" id="publicUrl" placeholder="如：https://xxx.trycloudflare.com">
        <div class="savedir-hint" style="margin-top:6px">留空则使用局域网地址，仅现场同 Wi-Fi 可访问</div>
        <button class="btn btn-primary" onclick="saveConfig()">保存并开始收集</button>
        <div class="savedir-hint" id="saveDirHint"></div>
        <div style="margin-top:16px; display:flex; gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="openFolder()">打开保存文件夹</button>
          <button class="btn btn-danger btn-sm" onclick="resetEvent()">结束本场 / 清空计数</button>
        </div>
      </div>

      <div class="card qr-box">
        <h2 style="text-align:left">现场扫码上传</h2>
        <img id="qrImg" src="/api/qrcode" alt="二维码">
        <div class="qr-hint">📱 手机扫码上传简历</div>
        <div class="qr-url" id="qrUrl"></div>
      </div>
    </div>

    <!-- 右栏：实时统计 -->
    <div>
      <div class="card">
        <h2>实时收集情况</h2>
        <div class="stat-row">
          <div class="stat"><div class="num" id="statCount">0</div><div class="lbl">已收简历</div></div>
          <div class="stat"><div class="num" id="statToday">0</div><div class="lbl">最近上传</div></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
          <h2 style="margin:0">最近上传</h2>
          <span class="status-pill" id="livePill">● 实时监听中</span>
        </div>
        <ul class="recent" id="recentList">
          <li class="empty">暂无上传记录</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let config = null;

function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    config = await r.json();
    document.getElementById('eventName').value = config.event_name;
    document.getElementById('saveDir').value = config.save_dir;
    document.getElementById('publicUrl').value = config.public_url || '';
    document.getElementById('saveDirHint').textContent = '当前保存目录：' + config.save_dir;
    document.getElementById('headerEvent').textContent = config.event_name;
    document.getElementById('qrUrl').textContent = getAccessUrl(config);
    renderStats(config.count, config.host_ip);
  } catch (e) {
    toast('无法连接后端服务', true);
  }
}

async function saveConfig() {
  const payload = {
    event_name: document.getElementById('eventName').value,
    save_dir: document.getElementById('saveDir').value,
    public_url: document.getElementById('publicUrl').value,
  };
  const r = await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    toast((err.detail || '保存失败'), true);
    return;
  }
  config = await r.json();
  // 刷新二维码（目录/名称变化不影响 URL，但保持一致性）
  document.getElementById('qrImg').src = '/api/qrcode?t=' + Date.now();
  loadConfig();
  toast('已保存并开始收集 ✅');
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    renderStats(d.count, config ? config.host_ip : '');
    renderRecent(d.recent);
  } catch (e) {}
}

function getAccessUrl(cfg) {
  const base = cfg.public_url || `http://${cfg.host_ip}:${cfg.port}`;
  return `手机访问地址：${base}/upload?event=${cfg.event_id}`;
}

function renderStats(count, ip) {
  document.getElementById('statCount').textContent = count;
  document.getElementById('statToday').textContent = count;
  document.getElementById('livePill').textContent = '● 运行中';
}

function renderRecent(recent) {
  const ul = document.getElementById('recentList');
  if (!recent || recent.length === 0) {
    ul.innerHTML = '<li class="empty">暂无上传记录</li>';
    return;
  }
  ul.innerHTML = recent.map(item => {
    const meta = `${item.upload_time.slice(11,16)} · ${item.name || '未留名'}`;
    return `<li>
      <span class="badge"></span>
      <span class="fname">📄 ${escapeHtml(item.original)}</span>
      <span class="meta">${escapeHtml(meta)}</span>
    </li>`;
  }).join('');
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function openFolder() {
  toast('请在电脑上手动打开资源管理器访问保存目录');
  // 浏览器无法直接打开本地文件夹，给出提示
}

async function resetEvent() {
  if (!confirm('确定结束当前招聘会并清空计数？新的一场会生成新二维码，已上传的文件不会删除。')) return;
  const r = await fetch('/api/event/reset', { method: 'POST' });
  config = await r.json();
  document.getElementById('qrImg').src = '/api/qrcode?t=' + Date.now();
  loadConfig();
  toast('已开始新一场招聘会');
}

function pickDir() {
  // 网页无法弹出本地目录选择框（需 Electron/Tauri），提示手动输入
  toast('请手动输入或粘贴文件夹路径（如 D:\\招聘会\\2026）');
}

loadConfig();
loadStats();
setInterval(loadStats, 3000); // 每 3 秒刷新统计
</script>
</body>
</html>
